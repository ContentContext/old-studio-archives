<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYV Comparison Tool - Make Your Choice 2014</title>
<style>
  :root { --ink:#222; --muted:#666; --line:#ddd; --bg:#fff; --accent:#0645ad; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; color:var(--ink); background:var(--bg); line-height:1.45; }
  header { padding:24px 16px 8px; max-width:1100px; margin:0 auto; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0; }
  .back { font-size:13px; }
  .controls { max-width:1100px; margin:16px auto; padding:0 16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  select, input { width:100%; padding:9px 10px; font-size:15px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  .count { max-width:1100px; margin:0 auto; padding:0 16px 8px; font-size:14px; color:var(--muted); }
  main { max-width:1100px; margin:0 auto; padding:0 16px 48px; }
  .party { border-top:1px solid var(--line); padding:16px 0; }
  .party h2 { font-size:17px; margin:0 0 2px; }
  .party .meta { font-size:13px; color:var(--muted); margin-bottom:10px; }
  .theme { display:grid; grid-template-columns:170px 1fr; gap:12px; padding:6px 0; }
  .theme .name { font-size:13px; font-weight:bold; color:var(--accent); }
  .theme .text { font-size:15px; }
  .empty { font-size:14px; color:var(--muted); font-style:italic; }
  .none { padding:32px 0; color:var(--muted); }
  @media (max-width:640px) { .theme { grid-template-columns:1fr; gap:2px; } }
</style>
</head>
<body>
<header>
  <p class="back"><a href="../index.html">&larr; Make Your Choice: 2014 EU Election Guide</a></p>
  <h1>Comparison Tool: party positions on youth issues</h1>
  <p class="sub">Compare how parties in 28 EU countries answered seven questions from the League of Young Voters. Source: LYV comparison data (2014).</p>
</header>
<section class="controls">
  <div><label for="country">Country</label><select id="country"><option value="">All countries</option></select></div>
  <div><label for="theme">Theme</label><select id="theme"><option value="">All themes</option></select></div>
  <div><label for="lang">Language</label><select id="lang"><option value="english">English</option><option value="original">Original language</option></select></div>
  <div><label for="q">Search party or text</label><input id="q" type="search" placeholder="e.g. SPÖ or youth"></div>
</section>
<div class="count" id="count"></div>
<main id="results"><p class="none">Loading positions&hellip;</p></main>
<script>
(function () {
  var data = null, el = {
    country: document.getElementById('country'),
    theme: document.getElementById('theme'),
    lang: document.getElementById('lang'),
    q: document.getElementById('q'),
    results: document.getElementById('results'),
    count: document.getElementById('count')
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fillSelects() {
    var countries = {};
    data.parties.forEach(function (p) { countries[p.country] = true; });
    Object.keys(countries).sort().forEach(function (c) {
      var o = document.createElement('option'); o.value = c; o.textContent = c; el.country.appendChild(o);
    });
    data.themes.forEach(function (t) {
      var o = document.createElement('option'); o.value = t; o.textContent = t; el.theme.appendChild(o);
    });
  }

  function render() {
    var c = el.country.value, t = el.theme.value, lang = el.lang.value;
    var q = el.q.value.trim().toLowerCase();
    var shown = data.parties.filter(function (p) {
      if (c && p.country !== c) return false;
      if (q) {
        var hay = (p.party + ' ' + p.country).toLowerCase();
        var inText = Object.keys(p.themes).some(function (k) {
          var v = p.themes[k]; return (v.english + ' ' + v.original).toLowerCase().indexOf(q) !== -1;
        });
        if (hay.indexOf(q) === -1 && !inText) return false;
      }
      return true;
    });
    el.count.textContent = shown.length + ' of ' + data.parties.length + ' parties';
    if (!shown.length) { el.results.innerHTML = '<p class="none">No parties match these filters.</p>'; return; }
    var themes = t ? [t] : data.themes;
    el.results.innerHTML = shown.map(function (p) {
      var rows = themes.map(function (name) {
        var v = p.themes[name] || {};
        var text = lang === 'original' ? (v.original || v.english) : (v.english || v.original);
        return '<div class="theme"><div class="name">' + esc(name) + '</div><div class="text">' +
          (text ? esc(text) : '<span class="empty">No position recorded</span>') + '</div></div>';
      }).join('');
      return '<article class="party"><h2>' + esc(p.party) + '</h2><div class="meta">' + esc(p.country) + '</div>' + rows + '</article>';
    }).join('');
  }

  [el.country, el.theme, el.lang].forEach(function (x) { x.addEventListener('change', render); });
  el.q.addEventListener('input', render);

  fetch('lyv_data.json').then(function (r) { return r.json(); }).then(function (json) {
    data = json; fillSelects(); render();
  }).catch(function () {
    el.results.innerHTML = '<p class="none">The comparison data could not be loaded.</p>';
  });
})();
</script>
</body>
</html>
